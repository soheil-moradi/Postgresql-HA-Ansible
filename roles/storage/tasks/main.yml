---
# Every mutating operation is gated by read-only validation.
- name: Validate PostgreSQL storage identity and destination
  ansible.builtin.import_tasks: validate.yml

- name: Initialize PostgreSQL volume group on the confirmed empty disk
  community.general.lvg:
    vg: "{{ postgres_vg_name }}"
    pvs: "{{ postgres_data_device }}"
    remove_extra_pvs: false
    state: present
  when: not storage_disk_is_managed | bool

- name: Initialize PostgreSQL logical volume on the new VG
  community.general.lvol:
    vg: "{{ postgres_vg_name }}"
    lv: "{{ postgres_lv_name }}"
    size: 100%FREE
    shrink: false
    state: present
  when: not storage_disk_is_managed | bool

- name: Create filesystem only on the newly initialized logical volume
  community.general.filesystem:
    dev: "/dev/{{ postgres_vg_name }}/{{ postgres_lv_name }}"
    fstype: "{{ postgres_filesystem }}"
    opts: "{{ '-m ' ~ postgres_ext4_reserved_percent if postgres_filesystem == 'ext4' else omit }}"
    force: false
  when: not storage_disk_is_managed | bool

- name: Create PostgreSQL mountpoint when absent
  ansible.builtin.file:
    path: "{{ postgres_mount_point }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: not storage_mountpoint_stat.stat.exists

- name: Mount verified PostgreSQL filesystem and persist it in fstab
  ansible.posix.mount:
    path: "{{ postgres_mount_point }}"
    src: "/dev/{{ postgres_vg_name }}/{{ postgres_lv_name }}"
    fstype: "{{ postgres_filesystem }}"
    opts: "{{ postgres_mount_options }}"
    state: mounted

- name: Verify the mountpoint after storage reconciliation
  ansible.builtin.command:
    argv: [findmnt, --mountpoint, "{{ postgres_mount_point }}", --noheadings, --output, SOURCE,FSTYPE]
  changed_when: false
  register: storage_final_mount

- name: Verify the expected filesystem type is mounted
  ansible.builtin.assert:
    that:
      - (storage_final_mount.stdout | split() | last) == postgres_filesystem
    fail_msg: "PostgreSQL filesystem was not mounted with the expected type."

- name: Resolve mounted PostgreSQL source after reconciliation
  ansible.builtin.command:
    argv: [readlink, -f, "{{ (storage_final_mount.stdout | split())[0] }}"]
  changed_when: false
  register: storage_final_mount_source

- name: Resolve expected PostgreSQL LV source after reconciliation
  ansible.builtin.command:
    argv: [readlink, -f, "/dev/{{ postgres_vg_name }}/{{ postgres_lv_name }}"]
  changed_when: false
  register: storage_final_lv_source

- name: Assert the mounted source is the declared PostgreSQL LV
  ansible.builtin.assert:
    that:
      - storage_final_mount_source.stdout | trim == storage_final_lv_source.stdout | trim
    fail_msg: "PostgreSQL mount is backed by a different block device."
