---
- name: Install Keepalived
  ansible.builtin.apt:
    name: keepalived
    state: present
    policy_rc_d: 101

- name: Install HAProxy health check script for Keepalived
  ansible.builtin.template:
    src: check_haproxy.sh.j2
    dest: /usr/local/sbin/check_haproxy.sh
    owner: root
    group: root
    mode: "0755"

- name: Configure Keepalived with unicast VRRP
  ansible.builtin.template:
    src: keepalived.conf.j2
    dest: /etc/keepalived/keepalived.conf
    owner: root
    group: root
    mode: "0600"
    validate: "keepalived -t -f %s"
  no_log: true
  notify: Restart Keepalived

- name: Validate Keepalived configuration
  ansible.builtin.command: keepalived -t -f /etc/keepalived/keepalived.conf
  changed_when: false
  no_log: true

- name: Enable and start Keepalived
  ansible.builtin.systemd_service:
    name: keepalived
    enabled: true
    state: started

- name: Wait for PostgreSQL endpoint to become reachable through the VIP
  ansible.builtin.wait_for:
    host: "{{ postgres_cluster_vip }}"
    port: "{{ haproxy_postgresql_port }}"
    timeout: 60
  run_once: true

- name: Apply pending load balancer changes before advancing to the next node
  ansible.builtin.meta: flush_handlers

- name: Verify both local endpoint services recovered
  ansible.builtin.command: "systemctl is-active {{ item }}"
  loop: [haproxy, keepalived]
  register: endpoint_service_health
  changed_when: false
  retries: 10
  delay: 2
  until: endpoint_service_health.rc == 0

- name: Verify the VIP still routes to PostgreSQL after this node
  ansible.builtin.command:
    argv: [pg_isready, -h, "{{ postgres_cluster_vip }}", -p, "{{ haproxy_postgresql_port | string }}", -t, '5']
  register: rolling_vip_health
  changed_when: false
  retries: 20
  delay: 2
  until: rolling_vip_health.rc == 0
