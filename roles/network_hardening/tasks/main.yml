---
- name: Leave network policy unchanged when enforcement is disabled
  ansible.builtin.meta: end_host
  when: not postgresql_network_hardening_enforce | bool

- name: Read actual SSH source before sudo
  become: false
  ansible.builtin.shell: 'printf "%s" "$SSH_CONNECTION"'
  register: firewall_ssh_tuple
  changed_when: false

- name: Require known SSH source and reviewed networks
  ansible.builtin.assert:
    that:
      - firewall_ssh_tuple.stdout.split() | length == 4
      - postgresql_admin_cidrs | length > 0
      - postgresql_network_extra_cidrs | length == 0
    fail_msg: "Use explicit admin/application/monitoring CIDRs; extra unrestricted CIDRs are unsupported."

- name: Install nftables without enabling its generic service
  ansible.builtin.apt:
    name: nftables
    state: present
    policy_rc_d: 101

- name: Install managed firewall helper
  ansible.builtin.copy:
    src: network_policy.py
    dest: /usr/local/sbin/pg-ha-network
    owner: root
    group: root
    mode: '0755'

- name: Build firewall inputs
  ansible.builtin.set_fact:
    firewall_inputs:
      nodes: "{{ groups['postgresql_cluster'] | map('extract', hostvars, 'ansible_host') | list }}"
      vip: "{{ postgres_cluster_vip }}"
      admin: "{{ postgresql_admin_cidrs }}"
      applications: "{{ postgresql_application_cidrs }}"
      monitoring: "{{ postgresql_monitoring_cidrs }}"
      ssh_source: "{{ firewall_ssh_tuple.stdout.split()[0] }}"
      allow_etcd_metrics_to_monitoring: "{{ postgresql_etcd_metrics_network_access | bool }}"
      ports:
        ssh: "{{ ansible_port | int }}"
        postgres: "{{ postgresql_port | int }}"
        vip: "{{ haproxy_postgresql_port | int }}"
        patroni: "{{ patroni_rest_port | int }}"
        etcd_client: "{{ etcd_client_port | int }}"
        etcd_peer: "{{ etcd_peer_port | int }}"
        haproxy_metrics: "{{ haproxy_prometheus_port | int }}"
        postgres_metrics: "{{ postgresql_exporter_port | int }}"

- name: Render and validate inputs before touching firewall rules
  ansible.builtin.command:
    argv: [/usr/local/sbin/pg-ha-network, render]
    stdin: "{{ firewall_inputs | to_json }}"
  register: firewall_policy_preview
  changed_when: false

- name: Apply policy with independent automatic rollback
  ansible.builtin.command:
    argv: [/usr/local/sbin/pg-ha-network, apply]
    stdin: "{{ firewall_inputs | to_json }}"
  changed_when: true
  when: not ansible_check_mode

- name: Close persistent SSH transport to test a new connection
  ansible.builtin.meta: reset_connection

- name: Verify a fresh SSH connection before committing policy
  ansible.builtin.wait_for_connection:
    timeout: 30
  when: not ansible_check_mode

- name: Verify all etcd endpoints through the new policy
  ansible.builtin.command:
    argv: [etcdctl, "--endpoints={{ etcd_client_endpoints_csv }}", endpoint, health]
  environment:
    ETCDCTL_API: '3'
  changed_when: false
  when: not ansible_check_mode

- name: Verify database endpoint before committing policy
  ansible.builtin.command:
    argv: [pg_isready, -h, "{{ postgres_cluster_vip }}", -p, "{{ haproxy_postgresql_port | string }}", -t, '5']
  changed_when: false
  when: not ansible_check_mode

- name: Commit policy after connectivity verification
  ansible.builtin.command:
    argv: [/usr/local/sbin/pg-ha-network, commit]
  changed_when: true
  when: not ansible_check_mode

- name: Install reboot persistence for the dedicated table
  ansible.builtin.template:
    src: pg-ha-network.service.j2
    dest: /etc/systemd/system/pg-ha-network.service
    owner: root
    group: root
    mode: '0644'

- name: Enable the dedicated firewall boot unit
  ansible.builtin.systemd_service:
    name: pg-ha-network
    enabled: true
    daemon_reload: true
