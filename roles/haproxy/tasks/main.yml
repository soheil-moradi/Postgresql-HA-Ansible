---
- name: Install HAProxy
  ansible.builtin.apt:
    name: haproxy
    state: present
    policy_rc_d: 101

- name: Allow HAProxy to bind the non-local VIP on standby nodes
  ansible.posix.sysctl:
    name: net.ipv4.ip_nonlocal_bind
    value: "1"
    state: present
    sysctl_set: true
    reload: true

- name: Configure HAProxy PostgreSQL primary endpoint
  ansible.builtin.template:
    src: haproxy.cfg.j2
    dest: /etc/haproxy/haproxy.cfg
    owner: root
    group: root
    mode: "0644"
    validate: "haproxy -c -f %s"
  notify: Reload HAProxy

- name: Enable and start HAProxy
  ansible.builtin.systemd_service:
    name: haproxy
    enabled: true
    state: started
