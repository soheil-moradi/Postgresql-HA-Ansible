---
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Reload Patroni if running
  ansible.builtin.shell: |
    set -euo pipefail
    if systemctl is-active --quiet patroni.service; then
      systemctl reload patroni.service
      echo reloaded
    else
      echo inactive
    fi
  args:
    executable: /bin/bash
  register: patroni_reload_handler
  changed_when: "'reloaded' in patroni_reload_handler.stdout"
