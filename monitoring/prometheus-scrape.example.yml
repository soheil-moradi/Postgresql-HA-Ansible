# Prometheus scrape EXAMPLE ONLY.
# Replace placeholders with real node DNS/IP values.

scrape_configs:
  - job_name: patroni
    metrics_path: /metrics
    # Set scheme: https and add tls_config when patroni_rest_tls_enabled=true.
    # The default verify_client=optional does not require a client certificate.
    static_configs:
      - targets:
          - "<PG-NODE-01>:8008"
          - "<PG-NODE-02>:8008"
          - "<PG-NODE-03>:8008"

  - job_name: etcd
    metrics_path: /metrics
    # etcd TLS uses client authentication. Replace these placeholders with the
    # monitoring client's CA/certificate/key delivered by your secret system.
    # scheme: https
    # tls_config:
    #   ca_file: /etc/prometheus/tls/etcd-ca.crt
    #   cert_file: /etc/prometheus/tls/etcd-client.crt
    #   key_file: /etc/prometheus/tls/etcd-client.key
    static_configs:
      - targets:
          - "<PG-NODE-01>:2379"
          - "<PG-NODE-02>:2379"
          - "<PG-NODE-03>:2379"

  - job_name: postgres
    metrics_path: /metrics
    static_configs:
      - targets:
          - "<PG-NODE-01>:9187"
          - "<PG-NODE-02>:9187"
          - "<PG-NODE-03>:9187"

  - job_name: haproxy
    metrics_path: /metrics
    static_configs:
      - targets:
          - "<PG-NODE-01>:8404"
          - "<PG-NODE-02>:8404"
          - "<PG-NODE-03>:8404"

# node_exporter is intentionally not defined here; it is already managed by
# the infrastructure monitoring platform.
