---
# OPT-IN, DISRUPTIVE LAB TEST: reboots each approved disposable VM in turn.
# No disk formatting, PV/VG/LV creation, or mount repair is performed here.
- ansible.builtin.import_playbook: inventory-preflight.yml

- name: Verify PostgreSQL storage data survives a controlled lab reboot
  hosts: postgresql_nodes
  become: true
  gather_facts: false
  serial: 1
  any_errors_fatal: true

  pre_tasks:
    - name: Refuse reboot without explicit disposable-lab approval
      ansible.builtin.assert:
        that:
          - postgres_storage_persistence_test_approved | default(false) | bool
          - postgres_storage_discovery_mode | default('explicit') == 'auto'
          - not (postgres_storage_initialize | default(false) | bool)
        fail_msg: >-
          This playbook REBOOTS hosts. It is restricted to explicitly approved
          disposable lab nodes with auto discovery; do not use it in production.

  tasks:
    - name: Test persistence and always try to remove only our temporary probe
      block:
        - name: Verify the existing mount before creating the probe
          ansible.builtin.include_tasks: tasks/storage-persistence-verify.yml

        - name: Create a uniquely named temporary probe on the PostgreSQL filesystem
          ansible.builtin.tempfile:
            state: file
            path: "{{ postgres_mount_point }}"
            prefix: .ansible-storage-persistence-
            suffix: .probe
          register: storage_persistence_probe

        - name: Write verifiable content to the probe without touching other data
          ansible.builtin.copy:
            dest: "{{ storage_persistence_probe.path }}"
            content: "{{ inventory_hostname }} {{ storage_persistence_probe.path }}\n"
            owner: root
            group: root
            mode: '0600'

        - name: Flush pending writes before reboot
          ansible.builtin.command:
            argv: [sync]
          changed_when: false

        - name: Reboot this disposable lab node and wait for SSH to return
          ansible.builtin.reboot:
            reboot_timeout: 600

        - name: Verify the same managed mount is active after reboot
          ansible.builtin.include_tasks: tasks/storage-persistence-verify.yml

        - name: Read the probe only after validating the post-reboot mount
          ansible.builtin.slurp:
            src: "{{ storage_persistence_probe.path }}"
          register: storage_persistence_probe_read

        - name: Assert that the probe survived reboot byte-for-byte
          ansible.builtin.assert:
            that:
              - (storage_persistence_probe_read.content | b64decode) == (inventory_hostname ~ ' ' ~ storage_persistence_probe.path ~ '\n')
            fail_msg: "Probe data was lost or changed after reboot."
      always:
        - name: Check the mount exists before attempting probe cleanup
          ansible.builtin.command:
            argv:
              - findmnt
              - --mountpoint
              - "{{ postgres_mount_point }}"
              - --noheadings
              - --output
              - SOURCE
          changed_when: false
          failed_when: false
          register: storage_persistence_cleanup_mount
          when:
            - storage_persistence_probe is defined
            - storage_persistence_probe.path is defined

        - name: Resolve the cleanup mount to its actual block device
          ansible.builtin.command:
            argv:
              - readlink
              - -f
              - "{{ storage_persistence_cleanup_mount.stdout | trim }}"
          changed_when: false
          failed_when: false
          register: storage_persistence_cleanup_source
          when:
            - storage_persistence_cleanup_mount is defined
            - storage_persistence_cleanup_mount.rc | default(1) == 0

        - name: Remove only our probe when the original LV remains mounted
          ansible.builtin.file:
            path: "{{ storage_persistence_probe.path }}"
            state: absent
          when:
            - storage_persistence_probe is defined
            - storage_persistence_probe.path is defined
            - storage_persistence_cleanup_source is defined
            - storage_persistence_cleanup_source.rc | default(1) == 0
            - storage_expected_lv_realpath is defined
            - storage_persistence_cleanup_source.stdout | trim == storage_expected_lv_realpath.stdout | trim
