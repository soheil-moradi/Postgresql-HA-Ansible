---
# For an existing externally managed archive tool. For managed pgBackRest use
# configure-backups.yml; never run both workflows with conflicting commands.
- name: Prepare external WAL archive configuration without automatic restart
  hosts: postgresql_cluster[0]
  become: true
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Skip disabled WAL archive management
      ansible.builtin.meta: end_play
      when: not postgresql_backup_management_enabled | bool

    - name: Require explicit external archive command and destination
      ansible.builtin.assert:
        that:
          - postgresql_backup_archive_command | length > 0
          - postgresql_backup_destination | length > 0

    - name: Converge external archive settings without touching unrelated DCS keys
      patroni_dynamic_config:
        url: "{{ patroni_rest_scheme }}://{{ ansible_host }}:{{ patroni_rest_port }}"
        username: "{{ patroni_rest_username }}"
        password: "{{ vault_patroni_rest_password }}"
        ca_file: "{{ patroni_rest_tls_ca_file if (patroni_rest_tls_enabled | bool) else omit }}"
        desired:
          postgresql:
            parameters:
              archive_mode: 'on'
              archive_command: "{{ postgresql_backup_archive_command }}"
              archive_timeout: "{{ postgresql_backup_archive_timeout }}"

- import_playbook: validate.yml
