---
# PostgreSQL TLS activation capability.
#
# DEFAULT:
#   postgresql_tls_activation_enabled: false
#
# IMPORTANT:
#   This playbook can write Patroni dynamic configuration when explicitly
#   enabled, but it intentionally does NOT restart the cluster and does NOT
#   enforce hostssl. Those are separate controlled rollout stages.

- name: Validate PostgreSQL TLS activation prerequisites
  hosts: postgresql_cluster
  become: true
  gather_facts: false

  tasks:
    - name: Explain why PostgreSQL TLS activation is disabled
      ansible.builtin.debug:
        msg: >-
          PostgreSQL TLS activation is disabled. No Patroni/PostgreSQL setting,
          service state, certificate file, or pg_hba rule is changed.
      when: not postgresql_tls_activation_enabled | bool

    - name: Check PostgreSQL server certificate
      ansible.builtin.stat:
        path: "{{ postgresql_tls_server_cert_file }}"
      register: postgresql_tls_activation_cert
      when: postgresql_tls_activation_enabled | bool

    - name: Check PostgreSQL server private key
      ansible.builtin.stat:
        path: "{{ postgresql_tls_server_key_file }}"
      register: postgresql_tls_activation_key
      when: postgresql_tls_activation_enabled | bool

    - name: Assert TLS certificate and key exist on every DB node
      ansible.builtin.assert:
        that:
          - postgresql_tls_activation_cert.stat.exists
          - postgresql_tls_activation_key.stat.exists
          - postgresql_tls_activation_key.stat.isreg
        fail_msg: >-
          Refusing TLS activation because the server certificate/private key
          are not present on this DB node.
      when: postgresql_tls_activation_enabled | bool

    - name: Validate certificate is still sufficiently valid
      ansible.builtin.command:
        argv:
          - openssl
          - x509
          - -in
          - "{{ postgresql_tls_server_cert_file }}"
          - -noout
          - -checkend
          - "{{ (postgresql_tls_minimum_validity_days | int) * 86400 }}"
      changed_when: false
      when: postgresql_tls_activation_enabled | bool

    - name: Validate certificate and private key match
      ansible.builtin.shell: |
        set -euo pipefail

        cert_fp="$(
          openssl x509 -in "{{ postgresql_tls_server_cert_file }}" -pubkey -noout \
          | openssl pkey -pubin -outform DER 2>/dev/null \
          | sha256sum | awk '{print $1}'
        )"

        key_fp="$(
          openssl pkey -in "{{ postgresql_tls_server_key_file }}" -pubout -outform DER 2>/dev/null \
          | sha256sum | awk '{print $1}'
        )"

        test "$cert_fp" = "$key_fp"
      args:
        executable: /bin/bash
      changed_when: false
      no_log: true
      when: postgresql_tls_activation_enabled | bool

- name: Prepare Patroni dynamic configuration for PostgreSQL TLS
  hosts: postgresql_cluster[0]
  become: true
  gather_facts: false

  tasks:
    - name: Render desired Patroni PostgreSQL TLS dynamic fragment
      ansible.builtin.copy:
        dest: /etc/patroni/dynamic-postgresql-tls.yml
        owner: root
        group: postgres
        mode: "0640"
        content: |
          postgresql:
            parameters:
              ssl: 'on'
              ssl_cert_file: '{{ postgresql_tls_server_cert_file }}'
              ssl_key_file: '{{ postgresql_tls_server_key_file }}'
              ssl_min_protocol_version: '{{ postgresql_tls_min_protocol_version }}'
      when: postgresql_tls_activation_enabled | bool

    - name: Read current Patroni dynamic configuration
      ansible.builtin.command:
        argv:
          - patronictl
          - -c
          - /etc/patroni/patroni.yml
          - show-config
          - "{{ postgres_cluster_name }}"
      register: postgresql_tls_activation_current_config
      changed_when: false
      when: postgresql_tls_activation_enabled | bool

    - name: Parse current dynamic PostgreSQL TLS parameters
      ansible.builtin.set_fact:
        postgresql_tls_activation_current_parameters: >-
          {{
            (
              postgresql_tls_activation_current_config.stdout
              | from_yaml
            ).get('postgresql', {}).get('parameters', {})
          }}
      when: postgresql_tls_activation_enabled | bool

    - name: Build desired PostgreSQL TLS parameter subset
      ansible.builtin.set_fact:
        postgresql_tls_activation_desired_parameters:
          ssl: "on"
          ssl_cert_file: "{{ postgresql_tls_server_cert_file }}"
          ssl_key_file: "{{ postgresql_tls_server_key_file }}"
          ssl_min_protocol_version: "{{ postgresql_tls_min_protocol_version }}"
      when: postgresql_tls_activation_enabled | bool

    - name: Determine whether Patroni TLS dynamic parameters need change
      ansible.builtin.set_fact:
        postgresql_tls_activation_change_required: >-
          {{
            postgresql_tls_activation_current_parameters.get('ssl', '') | string
            != postgresql_tls_activation_desired_parameters.ssl
            or
            postgresql_tls_activation_current_parameters.get('ssl_cert_file', '') | string
            != postgresql_tls_activation_desired_parameters.ssl_cert_file
            or
            postgresql_tls_activation_current_parameters.get('ssl_key_file', '') | string
            != postgresql_tls_activation_desired_parameters.ssl_key_file
            or
            postgresql_tls_activation_current_parameters.get('ssl_min_protocol_version', '') | string
            != postgresql_tls_activation_desired_parameters.ssl_min_protocol_version
          }}
      when: postgresql_tls_activation_enabled | bool

    - name: Print PostgreSQL TLS dynamic-config plan
      ansible.builtin.debug:
        msg:
          activation_enabled: "{{ postgresql_tls_activation_enabled }}"
          change_required: "{{ postgresql_tls_activation_change_required }}"
          desired_parameters: "{{ postgresql_tls_activation_desired_parameters }}"
          restart_policy: >-
            No automatic restart. Review Patroni pending-restart state and use
            the documented staged restart/switchover procedure.
      when: postgresql_tls_activation_enabled | bool

    - name: Apply PostgreSQL TLS parameters to Patroni DCS only when different
      ansible.builtin.command:
        argv:
          - patronictl
          - -c
          - /etc/patroni/patroni.yml
          - edit-config
          - "{{ postgres_cluster_name }}"
          - --apply
          - /etc/patroni/dynamic-postgresql-tls.yml
          - --force
      when:
        - postgresql_tls_activation_enabled | bool
        - postgresql_tls_activation_change_required | bool
      register: postgresql_tls_activation_apply
      changed_when: true

    - name: Read Patroni topology after TLS dynamic-config preparation
      ansible.builtin.command:
        argv:
          - patronictl
          - -c
          - /etc/patroni/patroni.yml
          - list
          - "{{ postgres_cluster_name }}"
          - --format
          - json
      register: postgresql_tls_activation_topology
      changed_when: false
      when: postgresql_tls_activation_enabled | bool

    - name: Show pending-restart review information
      ansible.builtin.debug:
        msg:
          topology: "{{ postgresql_tls_activation_topology.stdout | from_json }}"
          next_stage: >-
            TLS parameters are stored in Patroni DCS. Do not enforce hostssl.
            Perform a controlled rolling PostgreSQL restart, verify encrypted
            sessions and replication, then proceed to certificate verification
            and hostssl enforcement as separate changes.
      when: postgresql_tls_activation_enabled | bool

    - name: Remove temporary dynamic TLS fragment
      ansible.builtin.file:
        path: /etc/patroni/dynamic-postgresql-tls.yml
        state: absent
      when: postgresql_tls_activation_enabled | bool

# The current HA path should remain healthy because this playbook does not
# restart PostgreSQL automatically.
- import_playbook: validate.yml
