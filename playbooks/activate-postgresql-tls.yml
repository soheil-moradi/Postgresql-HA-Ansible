---
- name: Validate PostgreSQL TLS activation prerequisites
  hosts: postgresql_cluster
  any_errors_fatal: true
  become: true
  gather_facts: false
  tasks:
    - name: Explain why PostgreSQL TLS activation is disabled
      ansible.builtin.debug:
        msg: PostgreSQL TLS activation is disabled. No Patroni/PostgreSQL setting, service state, certificate file,
          or pg_hba rule is changed.
      when: not postgresql_tls_activation_enabled | bool
    - name: Check PostgreSQL server certificate
      ansible.builtin.stat:
        path: '{{ postgresql_tls_server_cert_file }}'
      register: postgresql_tls_activation_cert
      when: postgresql_tls_activation_enabled | bool
    - name: Check PostgreSQL server private key
      ansible.builtin.stat:
        path: '{{ postgresql_tls_server_key_file }}'
      register: postgresql_tls_activation_key
      when: postgresql_tls_activation_enabled | bool
    - name: Assert TLS certificate and key exist on every DB node
      ansible.builtin.assert:
        that:
          - postgresql_tls_activation_cert.stat.exists
          - postgresql_tls_activation_key.stat.exists
          - postgresql_tls_activation_key.stat.isreg
        fail_msg: Refusing TLS activation because the server certificate/private key are not present on this DB
          node.
      when: postgresql_tls_activation_enabled | bool
    - name: Validate certificate is still sufficiently valid
      ansible.builtin.command:
        argv:
          - openssl
          - x509
          - -in
          - '{{ postgresql_tls_server_cert_file }}'
          - -noout
          - -checkend
          - '{{ (postgresql_tls_minimum_validity_days | int) * 86400 }}'
      changed_when: false
      when: postgresql_tls_activation_enabled | bool
    - name: Validate certificate and private key match
      ansible.builtin.shell: |
        set -euo pipefail

        cert_fp="$(
          openssl x509 -in "{{ postgresql_tls_server_cert_file }}" -pubkey -noout \
          | openssl pkey -pubin -outform DER 2>/dev/null \
          | sha256sum | awk '{print $1}'
        )"

        key_fp="$(
          openssl pkey -in "{{ postgresql_tls_server_key_file }}" -pubout -outform DER 2>/dev/null \
          | sha256sum | awk '{print $1}'
        )"

        test "$cert_fp" = "$key_fp"
      args:
        executable: /bin/bash
      changed_when: false
      no_log: true
      when: postgresql_tls_activation_enabled | bool
    - name: Verify server certificate chain and server-auth purpose
      ansible.builtin.command:
        argv:
          - openssl
          - verify
          - -purpose
          - sslserver
          - -CAfile
          - '{{ postgresql_tls_ca_file }}'
          - -untrusted
          - '{{ postgresql_tls_server_cert_file }}'
          - '{{ postgresql_tls_server_cert_file }}'
      changed_when: false
      when: postgresql_tls_activation_enabled | bool
    - name: Ensure PostgreSQL can read and validate its private key
      become_user: postgres
      ansible.builtin.command:
        argv:
          - openssl
          - pkey
          - -in
          - '{{ postgresql_tls_server_key_file }}'
          - -noout
          - -check
      changed_when: false
      no_log: true
      when: postgresql_tls_activation_enabled | bool
    - name: Enforce secure server private-key ownership and permissions
      ansible.builtin.assert:
        that:
          - (postgresql_tls_activation_key.stat.pw_name == 'postgres' and postgresql_tls_activation_key.stat.mode
            == '0600') or (postgresql_tls_activation_key.stat.pw_name == 'root' and postgresql_tls_activation_key.stat.gr_name
            == 'postgres' and postgresql_tls_activation_key.stat.mode in ['0600','0640'])
      when: postgresql_tls_activation_enabled | bool
  pre_tasks:
    - name: Require whole-cluster activation checks
      ansible.builtin.assert:
        that:
          - ansible_play_hosts_all | sort == groups['postgresql_cluster'] | sort
        fail_msg: TLS activation must validate all nodes; remove --limit.
      run_once: true
- name: Prepare Patroni dynamic configuration for PostgreSQL TLS
  hosts: postgresql_cluster[0]
  any_errors_fatal: true
  become: true
  gather_facts: false
  tasks:
    - name: Activate TLS through the DCS after all-node preflight
      patroni_dynamic_config:
        url: "{{ patroni_rest_scheme }}://{{ ansible_host }}:{{ patroni_rest_port }}"
        username: '{{ patroni_rest_username }}'
        password: '{{ vault_patroni_rest_password }}'
        ca_file: '{{ patroni_rest_tls_ca_file if (patroni_rest_tls_enabled | bool) else omit }}'
        desired:
          postgresql:
            parameters:
              ssl: 'on'
              ssl_cert_file: '{{ postgresql_tls_server_cert_file }}'
              ssl_key_file: '{{ postgresql_tls_server_key_file }}'
              ssl_ca_file: '{{ postgresql_tls_ca_file }}'
              ssl_min_protocol_version: '{{ postgresql_tls_min_protocol_version }}'
      when: postgresql_tls_activation_enabled | bool
- name: Verify active encrypted connections on every node
  hosts: postgresql_cluster
  become: true
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Connect with CA verification and confirm session encryption
      ansible.builtin.command:
        argv:
          - psql
          - -X
          - -v
          - ON_ERROR_STOP=1
          - -Atc
          - SELECT ssl FROM pg_stat_ssl WHERE pid = pg_backend_pid();
      environment:
        PGHOST: '{{ ansible_host }}'
        PGPORT: '{{ postgresql_port | string }}'
        PGUSER: '{{ patroni_superuser_username }}'
        PGPASSWORD: '{{ vault_postgres_superuser_password }}'
        PGDATABASE: postgres
        PGSSLMODE: verify-ca
        PGSSLROOTCERT: '{{ postgresql_tls_ca_file }}'
        PGCONNECT_TIMEOUT: '5'
      register: tls_active_probe
      changed_when: false
      retries: 30
      delay: 2
      until: tls_active_probe.rc == 0 and tls_active_probe.stdout | trim == 't'
      no_log: true
      when: postgresql_tls_activation_enabled | bool
- import_playbook: validate.yml
