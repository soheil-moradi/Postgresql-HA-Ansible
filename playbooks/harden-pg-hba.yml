---
- name: Harden PostgreSQL client authentication through Patroni DCS
  hosts: postgresql_cluster
  become: true
  gather_facts: false
  vars:
    patroni_dynamic_pg_hba_file: /etc/patroni/dynamic-pg-hba.yml
  tasks:
    - name: Start desired pg_hba rule list with secure local authentication
      ansible.builtin.set_fact:
        postgresql_hba_desired:
          - local all all peer
          - host all all 127.0.0.1/32 scram-sha-256
          - host all all ::1/128 scram-sha-256
    - name: Add replication, rewind, and HAProxy source rules for every DB node
      ansible.builtin.set_fact:
        postgresql_hba_desired: |-
          {{
            postgresql_hba_desired
            + [
                'host replication ' ~ patroni_replication_username ~ ' '
                ~ hostvars[item].ansible_host ~ '/32 scram-sha-256',
                'host all ' ~ patroni_rewind_username ~ ' '
                ~ hostvars[item].ansible_host ~ '/32 scram-sha-256',
                'host all all ' ~ hostvars[item].ansible_host
                ~ '/32 scram-sha-256'
              ]
          }}
      loop: '{{ groups[''postgresql_cluster''] }}'
    - name: Add explicitly reviewed optional pg_hba rules
      ansible.builtin.set_fact:
        postgresql_hba_desired: '{{ postgresql_hba_desired + postgresql_hba_additional_rules }}'
    - name: Reject trust rules and conflicting plaintext exceptions
      ansible.builtin.assert:
        that:
          - postgresql_hba_desired | select('search', '\strust(\s|$)') | list | length == 0
          - not (postgresql_tls_require_ssl | bool) or (postgresql_hba_desired | select('match', '^hostnossl\s')
            | list | length == 0)
    - name: Enforce hostssl for TCP while retaining Unix peer administration
      ansible.builtin.set_fact:
        postgresql_hba_desired: '{{ postgresql_hba_desired | map(''regex_replace'', ''^host\s+'', ''hostssl '')
          | list }}'
      when: postgresql_tls_require_ssl | bool
    - name: Explain why DB-node source rules are required
      ansible.builtin.debug:
        msg: VIP client traffic is proxied by HAProxy running on the database nodes. PostgreSQL therefore needs
          to accept authenticated connections sourced from each database-node IP. Application authorization is still
          controlled by PostgreSQL roles/database privileges.
    - name: Apply and verify exact desired HBA list through Patroni DCS
      patroni_dynamic_config:
        url: "{{ patroni_rest_scheme }}://{{ ansible_host }}:{{ patroni_rest_port }}"
        username: '{{ patroni_rest_username }}'
        password: '{{ vault_patroni_rest_password }}'
        ca_file: '{{ patroni_rest_tls_ca_file if (patroni_rest_tls_enabled | bool) else omit }}'
        desired:
          postgresql:
            pg_hba: '{{ postgresql_hba_desired }}'
      run_once: true
    - name: Wait until every node has a valid pg_hba file with no trust rules
      become_user: postgres
      ansible.builtin.shell: |
        set -e
        psql -X -qAt -d postgres <<'SQL'
        SELECT count(*)
        FROM pg_hba_file_rules
        WHERE error IS NOT NULL
           OR auth_method = 'trust';
        SQL
      args:
        executable: /bin/bash
      register: pg_hba_security_check
      changed_when: false
      retries: 30
      delay: 2
      until:
        - pg_hba_security_check.rc == 0
        - pg_hba_security_check.stdout | trim == '0'
    - name: Verify Unix-socket peer administration still works
      become_user: postgres
      ansible.builtin.command:
        argv:
          - psql
          - -X
          - -qAt
          - -d
          - postgres
          - -c
          - SELECT current_user, pg_is_in_recovery();
      register: local_peer_test
      changed_when: false
    - name: Print local authentication validation result
      ansible.builtin.debug:
        var: local_peer_test.stdout
  any_errors_fatal: true
  pre_tasks:
    - name: Require all nodes for HBA convergence
      ansible.builtin.assert:
        that:
          - ansible_play_hosts_all | sort == groups['postgresql_cluster'] | sort
      run_once: true
    - name: Prove TLS on every node before enforcing hostssl
      ansible.builtin.command:
        argv:
          - psql
          - -X
          - -v
          - ON_ERROR_STOP=1
          - -Atc
          - SELECT ssl FROM pg_stat_ssl WHERE pid = pg_backend_pid();
      environment:
        PGHOST: '{{ ansible_host }}'
        PGPORT: '{{ postgresql_port | string }}'
        PGUSER: '{{ patroni_superuser_username }}'
        PGPASSWORD: '{{ vault_postgres_superuser_password }}'
        PGDATABASE: postgres
        PGSSLMODE: require
        PGSSLROOTCERT: '{{ postgresql_tls_ca_file }}'
        PGCONNECT_TIMEOUT: '5'
      register: hba_tls_proof
      changed_when: false
      failed_when: hba_tls_proof.rc != 0 or hba_tls_proof.stdout | trim != 't'
      no_log: true
      when: postgresql_tls_require_ssl | bool
- import_playbook: validate.yml
